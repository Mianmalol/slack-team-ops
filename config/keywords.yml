# Article feed configuration. Edit and push — the next run picks it up.
# Tuned for: token efficiency & AI value-attribution startup research
# (see docs/research-brief.md). Matching is case-insensitive, word-boundary,
# against article title + summary. Multi-word entries match as exact phrases.
